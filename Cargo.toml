[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/raft",
    "crates/metadata",
    "crates/storage",
    "crates/broker",
    "crates/wal",
    "crates/uploader",
    "crates/coordinator",
    "crates/compactor",
    "crates/cli",
    "crates/engine-bench",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

# Backtraces keep file and line; variables are not inspectable in a debugger.
# A clean `cargo test --workspace --no-run` drops from 4.9 GB to 4.0 GB on macOS.
[profile.dev]
debug = "line-tables-only"

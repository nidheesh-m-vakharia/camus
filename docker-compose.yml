name: camus

# Local stand-in for Cloudflare R2, plus three broker processes.
# Community MinIO images are no longer published, so `minio` is built from
# the archived release in deploy/minio.
# `docker compose up -d minio create-bucket` is enough for the storage test.
# The broker services build the release binary. They do not form the Raft
# group until `init` runs `camus admin init`.

services:
  minio:
    build: deploy/minio
    image: camus-minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: camus
      MINIO_ROOT_PASSWORD: camus-dev-secret
    volumes:
      - minio:/data

  create-bucket:
    image: camus-minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 camus camus-dev-secret; do sleep 1; done
        mc mb -p local/camus || true

  broker-1:
    build: .
    profiles: ["brokers"]
    command:
      - --node-id
      - "1"
      - --http-addr
      - 0.0.0.0:18001
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertised-addr
      - 127.0.0.1:9092
      - --data-dir
      - /data
      - --dev-plaintext
      - --allow-non-loopback
    environment: &s3
      CAMUS_S3_ENDPOINT: http://minio:9000
      CAMUS_S3_BUCKET: camus
      CAMUS_S3_ACCESS_KEY: camus
      CAMUS_S3_SECRET_KEY: camus-dev-secret
    ports:
      - "18001:18001"
      - "9092:9092"
    volumes: ["broker1:/data"]
    depends_on: [minio, create-bucket]

  broker-2:
    build: .
    profiles: ["brokers"]
    command:
      - --node-id
      - "2"
      - --http-addr
      - 0.0.0.0:18002
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertised-addr
      - 127.0.0.1:9093
      - --data-dir
      - /data
      - --dev-plaintext
      - --allow-non-loopback
    environment: *s3
    ports:
      - "18002:18002"
      - "9093:9092"
    volumes: ["broker2:/data"]
    depends_on: [minio, create-bucket]

  broker-3:
    build: .
    profiles: ["brokers"]
    command:
      - --node-id
      - "3"
      - --http-addr
      - 0.0.0.0:18003
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertised-addr
      - 127.0.0.1:9094
      - --data-dir
      - /data
      - --dev-plaintext
      - --allow-non-loopback
    environment: *s3
    ports:
      - "18003:18003"
      - "9094:9092"
    volumes: ["broker3:/data"]
    depends_on: [minio, create-bucket]

  init:
    build: .
    profiles: ["brokers"]
    depends_on: [broker-1, broker-2, broker-3]
    entrypoint: ["camus"]
    command:
      - admin
      - init
      - --broker
      - broker-1:18001
      - --peer
      - 1=broker-1:18001
      - --peer
      - 2=broker-2:18002
      - --peer
      - 3=broker-3:18003
    restart: "no"

volumes:
  minio:
  broker1:
  broker2:
  broker3:

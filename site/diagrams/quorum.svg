<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-quorum" viewBox="0 0 560 440" width="560" height="440" fill="none" stroke="currentColor" stroke-width="1" focusable="false" style="overflow:visible;font-family:Pollen, sans-serif;font-optical-sizing:auto;font-synthesis:none;font-weight:400;color:#171717" role="img" aria-labelledby="dg-quorum-title" aria-describedby="dg-quorum-desc">
<title id="dg-quorum-title">Committed where two of three agree</title>
<desc id="dg-quorum-desc">Three copies of the write-ahead log, aligned by entry. An entry is committed once two of the three voters have it on disk; the third catches up behind.</desc>

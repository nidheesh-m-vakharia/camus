<g opacity="1"><path d="M160 140h252v24h-252Z"/><path d="M188 140v24M216 140v24M244 140v24M272 140v24M300 140v24M328 140v24M356 140v24M384 140v24"/><path d="M160 192h224v24h-224Z"/><path d="M188 192v24M216 192v24M244 192v24M272 192v24M300 192v24M328 192v24M356 192v24"/><path d="M160 244h140v24h-140Z"/><path d="M188 244v24M216 244v24M244 244v24M272 244v24"/></g>
<g opacity="0.32" stroke-dasharray="3 5"><path d="M300 244h84v24h-84M328 244v24M356 244v24"/></g>
<g opacity="0.32"><path d="M384 104L384 132"/><path d="M384 300L384 324"/><path d="M160 288L160 348"/><path d="M384 288L384 348"/><path d="M160 344L199.5 344"/><path d="M344.5 344L384 344"/><path d="M156 348l8-8M380 348l8-8"/></g>
<g fill="currentColor" stroke="none" font-size="11" text-anchor="end" opacity="0.72"><text x="148" y="156">broker 1, leader</text><text x="148" y="208">broker 2</text><text x="148" y="260">broker 3</text></g>
<g fill="currentColor" stroke="none" font-size="10" text-anchor="middle" opacity="0.5"><text x="342" y="286">catching up</text><text x="272" y="347.5">committed on two of three</text></g>
<g fill="currentColor" stroke="none" font-size="10" text-anchor="start" opacity="0.5"><text x="422" y="156">leader only</text></g>
<g fill="currentColor" stroke="none" font-size="11" text-anchor="middle" opacity="0.72"><text x="384" y="94">commit index</text></g>
</svg>

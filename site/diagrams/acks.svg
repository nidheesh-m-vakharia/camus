<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-acks" viewBox="0 0 560 440" width="560" height="440" fill="none" stroke="currentColor" stroke-width="1" focusable="false" style="overflow:visible;font-family:Pollen, sans-serif;font-optical-sizing:auto;font-synthesis:none;font-weight:400;color:#171717" role="img" aria-labelledby="dg-acks-title" aria-describedby="dg-acks-desc">
<title id="dg-acks-title">Two places to acknowledge</title>
<desc id="dg-acks-desc">One batch on a time line. In wal mode the producer is acknowledged once a majority has fsynced the batch; in r2 mode only after the object is stored and its extent committed. Intervals are not to scale.</desc>
<g fill="currentColor" fill-opacity="0.055" stroke="none"><path class="dg-wait-wal" d="M80 196h88v64h-88Z"/></g>
<g opacity="1"><path d="M80 196h392v64h-392Z"/><path d="M168 196v64M372 196v64"/></g>
<g opacity="0.32"><path d="M168 188L168 136"/><path d="M472 188L472 136"/><path d="M80 264L80 274"/><path d="M168 264L168 274"/><path d="M372 264L372 274"/><path d="M472 264L472 274"/><path d="M80 340L472 340"/><path d="M472 340l-4.24 4.24M472 340l-4.24 -4.24"/></g>
<g fill="currentColor" stroke="none" font-size="11" text-anchor="middle" opacity="0.72"><text x="124" y="232">replicate</text><text x="270" y="232">waits in the WAL</text><text x="422" y="232">put, commit</text><text x="168" y="124">wal acknowledges</text><text x="472" y="124">r2 acknowledges</text></g>
<g fill="currentColor" stroke="none" font-size="10" text-anchor="middle" opacity="0.5"><text x="80" y="287">produce</text><text x="168" y="287">majority fsync</text><text x="372" y="287">upload</text><text x="472" y="287">metadata commit</text></g>
<g fill="currentColor" stroke="none" font-size="10" text-anchor="start" opacity="0.5"><text x="80" y="360">time, not to scale</text></g>
</svg>

<title id="dg-tail-title">One log, a short tail on disk</title>
<desc id="dg-tail-desc">The log&#x27;s sealed body lives as objects in the bucket. Each of three brokers holds only the same newest stretch, the unsealed tail, until the uploader moves it into the bucket.</desc>

[package]
name = "camus-coordinator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Consumer group coordinator: classic groups and KIP-848. Transactions come in Phase 5."

[dependencies]
camus-metadata = { path = "../metadata" }
regex = "1"
tokio = { version = "1", features = ["sync", "rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

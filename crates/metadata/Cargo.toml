[package]
name = "camus-metadata"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Metadata Raft group: topics will live here; Phase 0 stores a replicated map."

[dependencies]
anyhow = "1"
camus-protocol = { path = "../protocol" }
camus-raft = { path = "../raft" }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
redb = "4"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

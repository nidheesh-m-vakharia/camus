[package]
name = "camus-storage"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "R2/S3 object storage. MinIO is the local stand-in."

[dependencies]
anyhow = "1"
bytes = "1"
futures = "0.3"
object_store = { version = "0.14", features = ["aws"] }
url = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

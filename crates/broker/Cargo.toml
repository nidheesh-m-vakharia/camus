[package]
name = "camus-broker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Camus broker process: metadata Raft and a Prometheus endpoint."

[[bin]]
name = "camus-broker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
camus-metadata = { path = "../metadata" }
camus-protocol = { path = "../protocol" }
camus-storage = { path = "../storage" }
camus-uploader = { path = "../uploader" }
camus-wal = { path = "../wal" }
camus-coordinator = { path = "../coordinator" }
clap = { version = "4", features = ["derive"] }
openraft = { version = "=0.9.25", features = ["serde"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "sync", "time"] }
tokio-rustls = "0.26"
uuid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
camus-raft = { version = "0.1.0", path = "../raft" }

[dev-dependencies]
bytes = "1"
camus-protocol = { path = "../protocol" }
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }


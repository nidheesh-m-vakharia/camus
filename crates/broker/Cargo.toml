[package]
name = "camus-broker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Camus broker process: metadata Raft and a Prometheus endpoint."

[[bin]]
name = "camus-broker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
camus-metadata = { path = "../metadata" }
clap = { version = "4", features = ["derive"] }
openraft = { version = "=0.9.25", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }

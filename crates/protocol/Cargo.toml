[package]
name = "camus-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Kafka wire protocol generated from the Apache Kafka 4.4.0 message schemas."
publish = false

[lib]
doctest = false

[features]
default = ["client", "broker", "gzip", "zstd", "snappy", "lz4"]
messages_enums = []
client = []
broker = []
gzip = ["dep:flate2"]
zstd = ["dep:zstd"]
snappy = ["dep:snap"]
lz4 = ["dep:lz4"]

[dependencies]
anyhow = "1.0.80"
bytes = "1.10.1"
crc-fast = { version = "1.10.0", default-features = false, features = ["std"] }
flate2 = { version = "1.0.20", optional = true }
indexmap = "2.0.0"
lz4 = { version = "1.24", optional = true }
snap = { version = "1.0.5", optional = true }
serde = { version = "1", features = ["derive"] }
uuid = "1.3.0"
zstd = { version = "0.14", optional = true }

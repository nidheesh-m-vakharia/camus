[package]
name = "camus-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "camus admin. Later phases add cluster commands."

[[bin]]
name = "camus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking"] }
serde_json = "1"

[package]
name = "camus-raft"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Segment-file Raft log and openraft helpers."

[dependencies]
crc = "3"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["io-util", "rt", "sync", "time"] }
tracing = "0.1"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.11"
libc = "0.2"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package]
name = "camus-raft"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Segment-file Raft log and openraft helpers."

[dependencies]
crc = "3"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

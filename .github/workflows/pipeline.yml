name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: No added unwrap/expect
        run: scripts/agent-check.sh --no-test
      - name: Test
        run: cargo test --workspace --locked

  clients:
    name: clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/broker/tests/gophase5/go.mod
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: deploy/minio
          load: true
          tags: camus-minio:pinned
          cache-from: type=gha,scope=minio
          cache-to: type=gha,scope=minio,mode=min
      - name: MinIO
        run: |
          docker run -d --name camus-minio -p 9100:9000 \
            -e MINIO_ROOT_USER=camus \
            -e MINIO_ROOT_PASSWORD=camus-dev-secret \
            camus-minio:pinned server /data --console-address :9001
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:9100/minio/health/live && break
            sleep 2
          done
          curl -sf http://127.0.0.1:9100/minio/health/live
          docker exec -e MC_HOST_local=http://camus:camus-dev-secret@127.0.0.1:9000 \
            camus-minio mc mb -p local/camus
      - name: Small filesystem
        run: |
          image=$(mktemp)
          truncate -s 32M "$image"
          mkfs.ext4 -F "$image"
          sudo mkdir -p /mnt/camus-small
          sudo mount -o loop "$image" /mnt/camus-small
          sudo chmod 777 /mnt/camus-small
          echo "CAMUS_SMALL_FS=/mnt/camus-small" >> "$GITHUB_ENV"
      - name: Client toolchains
        run: |
          jars=target/kafka-jars
          mkdir -p "$jars"
          curl -fsSL -o "$jars/kafka-clients-4.4.0.jar" https://repo1.maven.org/maven2/org/apache/kafka/kafka-clients/4.4.0/kafka-clients-4.4.0.jar
          curl -fsSL -o "$jars/zstd-jni-1.5.7-17.jar" https://repo1.maven.org/maven2/com/github/luben/zstd-jni/1.5.7-17/zstd-jni-1.5.7-17.jar
          curl -fsSL -o "$jars/lz4-java-1.11.2.jar" https://repo1.maven.org/maven2/at/yawk/lz4/lz4-java/1.11.2/lz4-java-1.11.2.jar
          curl -fsSL -o "$jars/snappy-java-1.1.10.7.jar" https://repo1.maven.org/maven2/org/xerial/snappy/snappy-java/1.1.10.7/snappy-java-1.1.10.7.jar
          curl -fsSL -o "$jars/slf4j-api-1.7.36.jar" https://repo1.maven.org/maven2/org/slf4j/slf4j-api/1.7.36/slf4j-api-1.7.36.jar
          curl -fsSL -o "$jars/slf4j-simple-1.7.36.jar" https://repo1.maven.org/maven2/org/slf4j/slf4j-simple/1.7.36/slf4j-simple-1.7.36.jar
          # The Rust cache restores target/, including a venv whose pip
          # script points at a Python that is not on this runner.
          rm -rf target/pykafka
          python3 -m venv target/pykafka
          target/pykafka/bin/python -m pip install --disable-pip-version-check 'confluent-kafka==2.16.1'
          mkdir -p target/go/bin
          ln -sfn "$(command -v go)" target/go/bin/go
      - name: Test
        env:
          CAMUS_MINIO: "1"
          CAMUS_REQUIRE_CLIENTS: "1"
        run: |
          cargo test -p camus-broker --locked --tests
          cargo test -p camus-storage --locked --test minio

  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
